[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-cli"
version = "0.1.5"
description = "Graph-powered safety layer for AI coding agents built on FalkorDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.0.0",
    "rich>=12.0.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/thisisvaishnav/guard"
Repository = "https://github.com/thisisvaishnav/guard"
"Bug Tracker" = "https://github.com/thisisvaishnav/guard/issues"
Changelog = "https://github.com/thisisvaishnav/guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
embedded = [
    "falkordblite>=0.10.0; python_version>='3.12'",
]
mcp = []
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
    "rich>=12.0.0",
]

[project.scripts]
guard = "guard_cli.cli:main"
guard-cli = "guard_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guard_cli*"]
exclude = ["guard", "guard.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
